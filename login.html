<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Portal Login | Ahmed Wazir Agency</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="./styles.css" />

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              blue: '#3b82f6',
              dark: '#07090e',
              card: 'rgba(15, 23, 42, 0.65)'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#07090e] text-slate-100 antialiased min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full glass-card p-8 rounded-3xl border border-slate-800 shadow-2xl bg-[#080d1a]/95 backdrop-blur-2xl space-y-6">
    
    <!-- Header Logo -->
    <div class="text-center space-y-2">
      <div class="w-14 h-14 rounded-2xl bg-blue-600/20 border border-blue-500/40 text-blue-400 mx-auto flex items-center justify-center text-2xl shadow-lg shadow-blue-500/20">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <h2 class="text-2xl font-extrabold text-white tracking-wide">Admin Portal</h2>
      <p class="text-xs text-slate-400">Restricted access for Ahmed Wazir Agency Dashboard</p>
    </div>

    <!-- Login Form -->
    <form id="admin-login-form" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-300 mb-1.5">Username</label>
        <div class="relative">
          <span class="absolute left-3.5 top-3 text-slate-500 text-sm"><i class="fa-solid fa-user"></i></span>
          <input type="text" id="admin-user" placeholder="Enter username" class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-sm text-white focus:outline-none focus:border-blue-500" required autocomplete="username" />
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-300 mb-1.5">Password</label>
        <div class="relative">
          <span class="absolute left-3.5 top-3 text-slate-500 text-sm"><i class="fa-solid fa-key"></i></span>
          <input type="password" id="admin-pass" placeholder="Enter password" class="w-full pl-10 pr-10 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-sm text-white focus:outline-none focus:border-blue-500" required autocomplete="current-password" />
          <button type="button" id="toggle-pass-btn" class="absolute right-3.5 top-3 text-slate-400 hover:text-white text-sm focus:outline-none">
            <i class="fa-solid fa-eye" id="eye-icon"></i>
          </button>
        </div>
      </div>

      <div id="login-error" class="hidden text-xs text-red-400 bg-red-950/50 border border-red-500/30 p-3 rounded-xl text-center font-semibold">
        <i class="fa-solid fa-circle-exclamation mr-1"></i> Invalid username or password! Please try again.
      </div>

      <button type="submit" class="w-full py-3 rounded-xl bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 text-white font-bold text-sm shadow-lg shadow-blue-600/30 transition-all flex items-center justify-center gap-2 cursor-pointer">
        <span>Log In to Dashboard</span>
        <i class="fa-solid fa-arrow-right text-xs"></i>
      </button>
    </form>

    <div class="text-center pt-2 border-t border-slate-800/80">
      <a href="index.html" class="text-xs text-slate-500 hover:text-slate-300 transition-colors">
        &larr; Return to Public Website
      </a>
    </div>

  </div>

  <script>
    // Toggle Password Visibility
    const togglePassBtn = document.getElementById('toggle-pass-btn');
    const passInput = document.getElementById('admin-pass');
    const eyeIcon = document.getElementById('eye-icon');
    
    if (togglePassBtn) {
      togglePassBtn.addEventListener('click', () => {
        if (passInput.type === 'password') {
          passInput.type = 'text';
          eyeIcon.classList.remove('fa-eye');
          eyeIcon.classList.add('fa-eye-slash');
        } else {
          passInput.type = 'password';
          eyeIcon.classList.remove('fa-eye-slash');
          eyeIcon.classList.add('fa-eye');
        }
      });
    }

    // Login Form Handler
    document.getElementById('admin-login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const user = document.getElementById('admin-user').value.trim().toLowerCase();
      const pass = document.getElementById('admin-pass').value.trim();

      // Retrieve any custom password saved in settings
      let customPassword = 'ahmedwazir112233';
      try {
        const storedSettings = localStorage.getItem('aw_settings');
        if (storedSettings) {
          const s = JSON.parse(storedSettings);
          if (s && s.password) customPassword = s.password;
        }
      } catch (err) {}

      const validUsers = ['ahmedwazir', 'ahmed', 'admin'];
      const validPasswords = ['ahmedwazir112233', customPassword];

      if (validUsers.includes(user) && validPasswords.includes(pass)) {
        sessionStorage.setItem('adminAuth', 'true');
        sessionStorage.setItem('adminUser', user);
        window.location.href = 'admin.html';
      } else {
        const errEl = document.getElementById('login-error');
        errEl.classList.remove('hidden');
        errEl.classList.add('shake');
      }
    });
  </script>
</body>
</html>
